[build]
  publish = "public"
  functions = "netlify/functions"

[dev]
  publish = "public"

# GESKEDULEERDE FUNKSIES
#
# 04:00 UTC is 06:00 in Suid-Afrika (SAST is UTC+2). Netlify se bedieners
# loop op UTC; die skedule word dus altyd in UTC geskryf en 'n mens moet
# twee uur aftrek van die tyd wat jy hier wil sien gebeur.
#
# leen-herinnering: soek lenings wat binne vyf dae verval en stuur een pos
# per leen, met die opgraderingskoepon daarin. Sien die lêer se eie nota.
[functions."leen-herinnering"]
  schedule = "0 4 * * *"

# outeur-staat-herinnering: die eerste van elke maand, en dit gaan oor die
# maand wat pas klaar is. Nie oor die huidige nie -- 'n staat vir 'n maand
# wat pas begin het, is leeg.
[functions."outeur-staat-herinnering"]
  schedule = "0 4 1 * *"

# haal-paystack: haal Paystack se transaksielys vir die afgelope sewe dae en
# skryf elke geslaagde transaksie na die store. Die joernaal lei sy
# inskrywings daaruit af; niks word in die joernaal se store geskryf nie.
#
# 03:30 en nie 04:00 nie, sodat die twee funksies se logs nie deurmekaar loop
# nie. Die venster is sewe dae en nie een nie: loop die skedule een nag nie,
# dek die volgende loop daardie dag steeds.
[functions."haal-paystack"]
  schedule = "30 3 * * *"

# haal-vereffenings: haal Paystack se uitbetalings vir die afgelope sewe dae,
# vir die hoofrekening en vir elke begunstigde se subrekening, en skryf hulle
# na die store. Paystack betaal elke werksdag uit, en elke ontvanger kry sy
# eie uitbetaling.
#
# 03:45 en nie 03:30 nie: haal-paystack loop eerste, sodat die transaksies
# waarna 'n vereffening verwys reeds gestoor is wanneer sy aankom.
[functions."haal-vereffenings"]
  schedule = "45 3 * * *"

# gov-herinnering (Oktober 2026): Governance se sperdatums. Een e-pos per
# oggend met alles wat binne 'n herinneringsdrempel val. 04:20 UTC is 06:20
# in Suid-Afrika, ná die ander geskeduleerde funksies.
[functions."gov-herinnering"]
  schedule = "20 4 * * *"

# akk-herinnering (14 Okt 2026): Akkreditasies se sperdatums en hernuwings,
# dieselfde patroon as gov-herinnering, vyf minute later.
[functions."akk-herinnering"]
  schedule = "25 4 * * *"

# Netlify Identity registrasie-instellings word via die Netlify-kontrolepaneel
# gestel (nie hierdie lêer nie): "Oop registrasie" aan, standaard-rol by
# registrasie = "koper" (via 'n Identity-triggerfunksie, sien
# netlify/functions/identity-registrasie.js hieronder).

# DIE REGISTRASIEPORTAAL (September 2026).
#
# futureshop.futuresharp.co.za/portaal/* word STIL deurgestuur na die portaal
# se eie werf (future-sharp-vraelyste). Status 200 beteken die blaaier sien
# steeds hierdie adres: geen DNS-werk by Afrihost nodig nie. Die portaal leef
# ook op sy eie werf onder /portaal/, dus werk dieselfde paaie op albei.
#
# force = true, sodat niks in public/ ooit die pad kan oorskadu nie.
[[redirects]]
  from = "/portaal"
  to = "/portaal/registreer"
  status = 301

# DIE KORT SKAKELS wat julle uitstuur: /registrasie (Afrikaans) en /register
# (Engels). Dieselfde vorm; elkeen wys sy eie voorskou op WhatsApp.
[[redirects]]
  from = "/registrasie"
  to = "/portaal/registreer"
  status = 301

# Die Engelse ingang: dieselfde vorm, Engelse voorskou op WhatsApp.
[[redirects]]
  from = "/register"
  to = "/portaal/register"
  status = 301

[[redirects]]
  from = "/portaal/*"
  to = "https://future-sharp-vraelyste.netlify.app/portaal/:splat"
  status = 200
  force = true

# FUTURESHARP TALKS (September 2026).
#
# /talks is die FST-blad. /talks/<slug> is 'n talk se eie bladsy; dit word
# deur die Function talk-bladsy bedien, wat die talk se titel, oorsig en
# omslag in die kop sit sodat 'n gedeelde skakel op WhatsApp en LinkedIn 'n
# eie voorskou kry. futuresharp.co.za/talks en /talks/<slug> kom via die
# .htaccess op Afrihost hierheen.
[[redirects]]
  from = "/talks"
  to = "/talks.html"
  status = 200

[[redirects]]
  from = "/talks/*"
  to = "/.netlify/functions/talk-bladsy?slug=:splat"
  status = 200

# ADVERTENSIESKAKELS (Oktober 2026).
#
# /a/<slug> is 'n advertensie se deelskakel uit die paneel (Advertensies).
# Die Function advertensie-bladsy sit die advertensie se beeld in die kop vir
# WhatsApp en stuur 'n mens dan na die winkel. /a-beeld/<slug>.jpg is die
# voorskou en /a-beeld/<slug>-vol.jpg die volle beeld.
[[redirects]]
  from = "/a/*"
  to = "/.netlify/functions/advertensie-bladsy?slug=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/a-beeld/*"
  to = "/.netlify/functions/advertensie-bladsy?beeld=1&slug=:splat"
  status = 200
  force = true

# VERSLAGSKAKELS VIR SKOLE (Oktober 2026).
#
# /verslae/<slug> is 'n skool se verslagskakel uit die Future Sharp-paneel
# (Verslae). Die Function verslae-bladsy sit die skool se beeld in die kop vir
# WhatsApp en e-pos en stuur 'n mens dan na die skool se Google Drive-vouer.
# /verslae-beeld/<slug>.jpg is daardie beeld.
[[redirects]]
  from = "/verslae/*"
  to = "/.netlify/functions/verslae-bladsy?slug=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/verslae-beeld/*"
  to = "/.netlify/functions/verslae-bladsy?beeld=1&slug=:splat"
  status = 200
  force = true

# DOKUMENTESKAKELS VIR PERSONE (Oktober 2026).
#
# /dokumente/<kode> is 'n persoon se dokumenteskakel uit die Future Sharp-paneel
# (Dokumente). Die kode is lukraak, sodat die naam nie in die adres staan nie.
# /dokumente-beeld/<kode>.jpg is die beeld (Future Sharp, Dokumente).
[[redirects]]
  from = "/dokumente/*"
  to = "/.netlify/functions/dokumente-bladsy?kode=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/dokumente-beeld/*"
  to = "/.netlify/functions/dokumente-bladsy?beeld=1&kode=:splat"
  status = 200
  force = true
