<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sprekerspaneel — FutureSharp Talks</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/styl.css" />
  <link rel="stylesheet" href="css/spreker.css" />
  <meta name="theme-color" content="#171717">
  <link rel="icon" href="/icons/ikoon-32.png" sizes="32x32" type="image/png">
</head>
<body>
  <header class="mini-kop">
   <div class="mini-kop-inner">
    <a href="index.html" class="mini-kop-merk">
      <span class="merk-sharp">Future Sharp</span>
      <span class="merk-skeier">—</span>
      <span class="merk-shop">Future Shop</span>
    </a>
    <div class="mini-kop-regs">
      <span id="nav-rekening-plek" class="mini-kop-rekening-plek"></span>
      <div class="taal-wisselaar" role="group" aria-label="Taal / Language">
        <button type="button" class="taal-knoppie" data-taal="af">AF</button>
        <button type="button" class="taal-knoppie" data-taal="en">EN</button>
      </div>
    </div>
   </div>
  </header>

  <main>
    <div id="sp-status" class="stelsel-boodskap sp-status" aria-live="polite"></div>

    <div id="sp-inhoud" hidden>
      <div id="paneel-rol-plek"></div>

      <div class="sp-band">
        <div class="sp-band-in">
          <div class="sp-merk" aria-hidden="true">
            <span class="sp-merk-naam">FutureSharp</span>
            <span class="sp-merk-blokwrap"><span class="sp-merk-blokke"><b class="sp-b-t">T</b><b class="sp-b-g">A</b><b class="sp-b-k">L</b><b class="sp-b-t">K</b><b class="sp-b-g">S</b></span><span class="sp-merk-vloer"></span></span>
          </div>
          <span class="sp-oog" data-i18n="sp_oog">Sprekerspaneel</span>
          <h1 class="sp-naam" id="sp-naam">&nbsp;</h1>
          <p class="sp-lei" data-i18n="sp_lei">Jou talks, wie hulle besoek, en wat jy verdien.</p>
          <div class="sp-syfers" id="sp-syfers"></div>
        </div>
      </div>

      <nav class="sp-kieslys">
        <button type="button" class="sp-pil" data-gaan="talks" aria-pressed="true" data-i18n="sp_nav_talks">My talks</button>
        <button type="button" class="sp-pil" data-gaan="staat" aria-pressed="false" data-i18n="sp_nav_staat">Staat</button>
        <button type="button" class="sp-pil" data-gaan="besonderhede" aria-pressed="false" data-i18n="sp_nav_besonderhede">My besonderhede</button>
      </nav>

      <div class="sp-inhoud-wrap">
        <div id="sp-uitbetaling-wag" class="sp-wag" hidden>
          <strong data-i18n="sp_uitbetaling_wag">Jou uitbetalingsrekening word opgestel.</strong>
        </div>
        <section class="sp-afdeling" data-afdeling="talks"><div id="sp-talks"></div></section>
        <section class="sp-afdeling" data-afdeling="staat" hidden><div id="sp-staat"></div></section>
        <section class="sp-afdeling" data-afdeling="besonderhede" hidden><div id="sp-besonderhede"></div></section>
      </div>
    </div>
  </main>

  <script src="js/taal.js"></script>
  <script src="js/spreker-taal.js"></script>
  <script src="js/identiteit.js"></script>
  <script src="js/nav-rekening.js"></script>
  <script src="js/paneel-rol-skakelaar.js"></script>
  <script src="js/spreker.js"></script>
</body>
</html>
