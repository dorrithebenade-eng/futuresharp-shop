<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Leeskamer — Future Shop</title>
  <link rel="stylesheet" href="css/styl.css" />
  <link rel="stylesheet" href="css/my-boeke-harde-kopie.css" />

  <!-- PWA: Future Shop Leser-app -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#3FB6A4">

  <!-- Apple-spesifieke tags (iOS ondersteun nie standaard manifest-installasie ten volle nie) -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-ikoon.png">
  <!-- Die apple-weergawe is verouderd maar bly vir ouer iOS; Chrome
       vra uitdruklik dat die standaard-etiket daarby kom. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Future Shop">

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch((fout) => {
          console.error("Service worker-registrasie het misluk:", fout);
        });
      });
    }
  </script>
  <link rel="icon" href="/icons/ikoon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/icons/ikoon-16.png" sizes="16x16" type="image/png"></head>
<body>
  <header class="mini-kop">
   <div class="mini-kop-inner">
    <a href="index.html" class="mini-kop-merk">
      <span class="merk-sharp">Future Sharp</span>
      <span class="merk-skeier">—</span>
      <span class="merk-shop">Future Shop</span>
    </a>
    <div class="mini-kop-regs">
      <a href="mandjie.html" class="mini-kop-mandjie">
        <svg class="mandjie-ikoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span data-i18n="nav_mandjie">Mandjie</span>
        <span id="mandjie-teller" class="mandjie-teller"></span>
      </a>
      <span id="nav-rekening-plek" class="mini-kop-rekening-plek"></span>
      <div class="taal-wisselaar" role="group" aria-label="Taal / Language">
        <button type="button" class="taal-knoppie" data-taal="af">AF</button>
        <button type="button" class="taal-knoppie" data-taal="en">EN</button>
      </div>
    </div>
   </div>
  </header>
  <header class="kop kop--leeskamer">
    <div class="kop-kolom kop-kolom--een">
      <div class="kop-inhoud">
        <p class="kop-eyebrow" data-i18n="my_boeke_titel">My Leeskamer</p>
        <h1 class="kop-titel">
          <span class="kop-titel-brand" id="lk-welkom">&nbsp;</span>
        </h1>
        <p class="kop-subtitel" data-i18n="lk_sub">Jou boeke, gereed om te lees.</p>
      </div>
    </div>
  </header>
  <main class="lk-wrap">
    <div id="pwa-installeer-plek"></div>
    <section id="lk-verder" class="lk-verder" hidden></section>
    <section class="lk-rak">
      <div class="bk-ry-kop bk-ry-kop--met-skakel">
        <h2 class="bk-ry-titel" data-i18n="lk_my_boekrak">My boekrak</h2>
        <a class="bk-sien-alles" id="lk-teater" href="/teater" hidden><span data-i18n="nav_my_teater">My Teater</span> →</a>
      </div>
      <div id="my-boeke-status" class="stelsel-boodskap" aria-live="polite"></div>
      <div id="my-boeke-lys" class="my-boeke-rooster"></div>
    </section>
  </main>
  <script src="js/taal.js"></script>
  <script src="js/identiteit.js"></script>
  <script src="js/mandjie.js"></script>
  <script src="js/nav-rekening.js"></script>
  <script src="js/sessie-verval.js"></script>
  <script src="js/my-boeke.js"></script>
  <script src="js/installeer-app.js"></script>
  <script src="js/mandjie-opruiming.js"></script>
</body>
</html>
