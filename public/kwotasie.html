<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Future Sharp</title>
  <link rel="stylesheet" href="css/styl.css">
  <link rel="stylesheet" href="css/kwotasie.css">
  <!-- DIE F-MERK, NIE DIE WINKEL SE S NIE.
       Hierdie bladsy dra Future Sharp se naam alleen -- geen "Future Sharp —
       Future Shop"-woordmerk in die kop nie. Die ikoon-skrip van 4 September
       2026 het elke bladsy in public/ die winkel se ikoon gegee sonder om te
       vra aan watter kant sy behoort.
       Die lers heet `paneel-ikoon-*` omdat hulle vir die paneel gebou is; die
       merk self is Future Sharp s'n en dien albei. Een stel lers is beter as
       twee eenderse stelle met verskillende name. -->
  <link rel="icon" href="/icons/paneel-ikoon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/icons/paneel-ikoon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/icons/paneel-apple-touch-ikoon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#3FB6A4"></head>
<body>
  <!--
    DIE KWOTASIE SOOS DIE KLIENT HAAR SIEN, met die knoppie wat haar aanvaar.

    'n PUBLIEKE BLADSY. Geen sessie, geen aanmelding, geen paneelkode -- die
    klient is 'n rekord, nie 'n rekening nie. Die bewys is die sleutel plus die
    publieke kode in die skakel; sonder albei is die antwoord 404.

    taal.js laai omdat die bladsy in die KWOTASIE se taal lees, met t_in(), nie
    in die blaaier se taal nie. Die dokument wat die klient ontvang het, was in
    daardie taal; hierdie bladsy is dieselfde gesprek.

    GEEN WYSIGINGSVORM EN GEEN VERWERP-KNOPPIE. Wat 'n klient in 'n
    wysigingsveld sou tik, is nooit 'n instruksie wat uitgevoer kan word nie --
    dit is die begin van 'n gesprek wat in elk geval gevoer moet word. En 'n
    verwerp-knoppie sou 'n klient wat wil onderhandel 'n knoppie wys wat die
    gesprek toemaak, en hy klik hom omdat dit die naaste is aan "nee, nie so
    nie". Antwoord hy eenvoudig nie, doen Verval die werk.
  -->
  <div class="kw-blad">
    <div class="kw-merk">
      <img src="images/future-sharp-logo.png" alt="Future Sharp">
    </div>

    <div id="kw-inhoud">
      <div class="kw-kaart kw-besig">
        <div><span class="kw-stip"></span><span class="kw-stip"></span><span class="kw-stip"></span></div>
        <p id="kw-besig-teks"></p>
      </div>
    </div>
  </div>

  <p class="kw-voet" id="kw-voet"></p>

  <script src="js/taal.js"></script>
  <script src="js/kwotasie.js"></script>
</body>
</html>
