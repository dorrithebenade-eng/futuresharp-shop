<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // MOET voor die Identity-widget se eie skrip loop — sien nota in
    // mandjie.js vir hoekom. Netlify se e-pos-skakels (bevestiging,
    // uitnodiging, wagwoord-herstel) land altyd hier met 'n token in
    // die URL; op die oomblik het net personeel rekeninge, so ons stuur
    // dit dadelik na die paneelbord toe voor die widget dit self "opeet".
    (function () {
      var identiteitsTokenPatroon = /(confirmation_token|invite_token|recovery_token|email_change_token)=/;
      if (identiteitsTokenPatroon.test(window.location.hash)) {
        window.location.replace("bevestig.html" + window.location.hash);
      }
    })();
  </script>
  <title>Dankie — Future Shop</title>
  <link rel="stylesheet" href="css/styl.css">
  <link rel="stylesheet" href="css/dankie-stand.css">
</head>
<body>
  <header class="mini-kop">
   <div class="mini-kop-inner">
    <a href="index.html" class="mini-kop-merk">
      <span class="merk-sharp">Future Sharp</span>
      <span class="merk-skeier">—</span>
      <span class="merk-shop">Future Shop</span>
    </a>
    <div class="mini-kop-regs">
      <a href="mandjie.html" class="mini-kop-mandjie">
        <svg class="mandjie-ikoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span data-i18n="nav_mandjie">Mandjie</span>
        <span id="mandjie-teller" class="mandjie-teller"></span>
      </a>
      <span id="nav-rekening-plek" class="mini-kop-rekening-plek"></span>
      <div class="taal-wisselaar" role="group" aria-label="Taal / Language">
        <button type="button" class="taal-knoppie" data-taal="af">AF</button>
        <button type="button" class="taal-knoppie" data-taal="en">EN</button>
      </div>
    </div>
   </div>
  </header>
  <main class="dankie-wrap">
    <!-- DIE BLADSY WEET NOG NIKS. 'n Kansellasie op Paystack se betaalbladsy
         kom by DIESELFDE callback-URL uit as 'n geslaagde betaling, en
         Paystack stuur die verwysing terug, nie die uitslag nie. Die opskrif
         en die teks staan dus leeg tot kry-bestelstand.js geantwoord het --
         'n verstek van "Dankie vir jou bestelling" sou vir 'n oomblik lieg
         teenoor iemand wat pas gekanselleer het. Sien dankie-stand.js. -->
    <div class="dankie-kaart" id="dankie-kaart">
      <span class="dankie-merkie" id="dankie-merkie"></span>
      <h1 class="mandjie-titel" id="dankie-titel"></h1>
      <p class="dankie-teks" id="dankie-bestelnommer"></p>
      <p class="dankie-teks" id="dankie-teks"></p>
      <div class="dankie-knoppies">
        <a class="kaart-aksie dankie-knoppie" id="dankie-my-boeke-knoppie" href="my-boeke.html" data-i18n="gaan_na_my_boeke" hidden>Gaan na My Boeke</a>
        <!-- By 'n kansellasie is die mandjie nog vol en is DIT waarheen die
             koper moet gaan -- nie na die katalogus nie, waar hy sy keuses
             van voor af sou moes soek. -->
        <a class="kaart-aksie dankie-knoppie" id="dankie-mandjie-knoppie" href="mandjie.html" data-i18n="terug_mandjie" hidden>Terug na die mandjie</a>
        <!-- GEEN "TERUG NA DIE WINKEL" NIE. Die merk links bo in die kop gaan
             reeds daarheen, op elke bladsy, en die kop dra ook 'n eie skakel
             na My Boeke. 'n Uitgangknoppie langs die hoofaksie verdeel die
             aandag op die enkele oomblik waar daar niks te verdeel is nie:
             die koper het pas betaal en wil sy boek lees. -->
      </div>
      <p class="dankie-mandjie-nota" id="dankie-mandjie-nota"></p>
    </div>
  </main>
  <script src="js/taal.js"></script>
  <script src="js/identiteit.js"></script>
  <script src="js/mandjie.js"></script>
  <script src="js/nav-rekening.js"></script>
  <!-- DIE OU BLOK IS WEG. Hy het by ELKE uitkoms "Dankie vir jou bestelling"
       gese en die mandjie leeggemaak -- ook wanneer die koper op Paystack se
       bladsy gekanselleer het. Hy het dan niks betaal, niks gekoop, en sy
       mandjie was weg. dankie-stand.js vra eers wat gebeur het. -->
  <script src="js/dankie-stand.js"></script>
</body>
</html>
