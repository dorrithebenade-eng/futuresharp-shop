<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // MOET voor die Identity-widget se eie skrip loop — sien nota in
    // mandjie.js vir hoekom. Netlify se e-pos-skakels (bevestiging,
    // uitnodiging, wagwoord-herstel) land altyd hier met 'n token in
    // die URL; op die oomblik het net personeel rekeninge, so ons stuur
    // dit dadelik na die paneelbord toe voor die widget dit self "opeet".
    (function () {
      var identiteitsTokenPatroon = /(confirmation_token|invite_token|recovery_token|email_change_token)=/;
      if (identiteitsTokenPatroon.test(window.location.hash)) {
        window.location.replace("bevestig.html" + window.location.hash);
      }
    })();
  </script>
  <title>Dankie — Future Shop</title>
  <link rel="stylesheet" href="css/styl.css">
</head>
<body>
  <header class="mini-kop">
   <div class="mini-kop-inner">
    <a href="index.html" class="mini-kop-merk">
      <span class="merk-sharp">Future Sharp</span>
      <span class="merk-skeier">—</span>
      <span class="merk-shop">Future Shop</span>
    </a>
    <div class="mini-kop-regs">
      <a href="mandjie.html" class="mini-kop-mandjie">
        <svg class="mandjie-ikoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span data-i18n="nav_mandjie">Mandjie</span>
        <span id="mandjie-teller" class="mandjie-teller"></span>
      </a>
      <div class="taal-wisselaar" role="group" aria-label="Taal / Language">
        <button type="button" class="taal-knoppie" data-taal="af">AF</button>
        <button type="button" class="taal-knoppie" data-taal="en">EN</button>
      </div>
    </div>
   </div>
  </header>
  <main class="dankie-wrap">
    <h1 class="mandjie-titel" id="dankie-titel" data-i18n="dankie_titel">Dankie vir jou bestelling!</h1>
    <p class="dankie-teks" id="dankie-bestelnommer"></p>
    <p class="dankie-teks" id="dankie-teks" data-i18n="dankie_teks">
      Ons bevestig jou betaling tans bediener-kant. Sodra dit voltooi is,
      sal jou e-boeke onmiddellik in
      <strong>"My Boeke"</strong> beskikbaar wees, en jy sal die status van
      enige harde-kopie-items daar kan volg.
    </p>
    <div class="dankie-knoppies">
      <a class="kaart-aksie dankie-knoppie" id="dankie-my-boeke-knoppie" href="my-boeke.html" data-i18n="gaan_na_my_boeke" hidden>Gaan na My Boeke</a>
      <a class="kaart-aksie dankie-knoppie" href="index.html" data-i18n="terug_winkel">Terug na die winkel</a>
    </div>
  </main>
  <script src="js/taal.js"></script>
  <script src="js/mandjie.js"></script>
  <script>
    // Lees EERS wat in die mandjie was (om te bepaal watter tipe
    // bestelling dit was), voordat ons dit leegmaak.
    let mandjie_items = [];
    try {
      const ruwe = localStorage.getItem("future_shop_mandjie");
      mandjie_items = ruwe ? JSON.parse(ruwe) : [];
    } catch {
      mandjie_items = [];
    }
    const bevat_harde_kopie = mandjie_items.some((i) => i.formaat === "harde_kopie");
    const bevat_eboek = mandjie_items.some((i) => i.formaat === "eboek");

    // Maak seker die mandjie leeg is ná suksesvolle betaling — die
    // koper se bestelling leef nou permanent in die bestelling-rekord,
    // nie meer in die klant-kant mandjie nie.
    localStorage.removeItem("future_shop_mandjie");
    sessionStorage.removeItem("future_shop_bestelnommer_konsep");

    const params = new URLSearchParams(window.location.search);
    const bestelnommer = params.get("bestelnommer") || params.get("reference");
    const wrap = document.getElementById("dankie-bestelnommer");
    wrap.textContent = bestelnommer
      ? `${t("bestelnommer_etiket")}: ${bestelnommer}`
      : "";

    // Suiwer e-boek-mandjie: "aankoop" is korrek, geen fisiese proses
    // volg nie — wys 'n direkte knoppie na "My Boeke".
    if (bevat_eboek && !bevat_harde_kopie) {
      document.getElementById("dankie-titel").textContent = t("dankie_titel_aankoop");
      document.getElementById("dankie-teks").textContent = t("dankie_teks_eboek_alleen");
      document.getElementById("dankie-my-boeke-knoppie").hidden = false;
    } else if (bevat_harde_kopie) {
      // Bevat 'n harde kopie (met of sonder e-boek saam): "bestelling"
      // bly korrek — daar volg 'n regte druk-en-afleweringsproses.
      document.getElementById("dankie-titel").textContent = t("dankie_titel");
      document.getElementById("dankie-teks").textContent = t("dankie_teks_bevat_harde_kopie");
      if (bevat_eboek) {
        document.getElementById("dankie-my-boeke-knoppie").hidden = false;
      }
    }
    // As die mandjie om een of ander rede reeds leeg was toe hierdie
    // bladsy laai (bv. blaaier-terugknoppie ná 'n vorige besoek), bly
    // die verstek-teks uit die HTML staan — veilige, generiese fallback.
  </script>
</body>
</html>
