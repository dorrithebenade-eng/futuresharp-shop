<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boeke — Future Shop</title>
  <link rel="stylesheet" href="css/styl.css">
    <link rel="icon" href="/icons/ikoon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/icons/ikoon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-ikoon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#3FB6A4"></head>
<body>
  <header class="mini-kop">
   <div class="mini-kop-inner">
    <a href="index.html" class="mini-kop-merk">
      <span class="merk-sharp">Future Sharp</span>
      <span class="merk-skeier">—</span>
      <span class="merk-shop">Future Shop</span>
    </a>
    <div class="mini-kop-regs">
      <a href="mandjie.html" class="mini-kop-mandjie">
        <svg class="mandjie-ikoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span data-i18n="nav_mandjie">Mandjie</span>
        <span id="mandjie-teller" class="mandjie-teller"></span>
      </a>
      <span id="nav-rekening-plek" class="mini-kop-rekening-plek"></span>
      <div class="taal-wisselaar" role="group" aria-label="Taal / Language">
        <button type="button" class="taal-knoppie" data-taal="af">AF</button>
        <button type="button" class="taal-knoppie" data-taal="en">EN</button>
      </div>
    </div>
   </div>
  </header>
  <header class="kop kop--boeke">
    <div class="kop-kolom">
      <div class="kop-inhoud">
        <p class="kop-eyebrow" data-i18n="bk_oog">Boeke</p>
        <h1 class="kop-titel">
          <span class="kop-titel-brand" data-i18n-html="bk_titel">Lees <span class="goud">skerp</span>, lees verder.</span>
        </h1>
        <p class="kop-subtitel" data-i18n="bk_sub">Elke boek wag in jou eie Leeskamer, op jou foon, tablet of rekenaar.</p>
        <div class="bk-chips" id="boeke-chips"></div>
        <div class="bk-chips bk-taalkeuse" id="boeke-taal"></div>
      </div>
      <!-- Dieselfde waaier as die tuisblad (tuis-waaier.js). -->
      <div class="kop-waaier" id="kop-waaier" aria-hidden="true"></div>
    </div>
  </header>

  <main class="bk-wrap">
    <div id="boeke-rye"></div>
  </main>

  <script src="js/taal.js"></script>
  <script src="js/identiteit.js"></script>
  <script src="js/mandjie.js"></script>
  <script src="js/formaat-info.js"></script>
  <script src="js/nav-rekening.js"></script>
  <script src="js/boekkaart.js"></script>
  <script src="js/boeke.js"></script>
  <script src="js/tuis-waaier.js"></script>

</html>
